<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%2309090B'/%3E%3Crect x='6' y='6.5' width='4' height='4' rx='1' fill='%23FF4500'/%3E%3Crect x='11.75' y='7.25' width='6.25' height='2.5' rx='0.75' fill='%23F4F4F5'/%3E%3Crect x='6' y='12.25' width='12' height='2.25' rx='0.75' fill='%23F4F4F5' fill-opacity='0.85'/%3E%3Crect x='6' y='16' width='8.5' height='2.25' rx='0.75' fill='%23F4F4F5' fill-opacity='0.55'/%3E%3C/svg%3E"
    />
    <title>Subfeed — Minimal Reddit Reader</title>
    <meta
      name="description"
      content="A minimal Geist Mono Reddit reader for browsing top, new, best, hot, and rising posts across your custom list of subreddits."
    />
    <meta property="og:title" content="Subfeed — Minimal Reddit Reader" />
    <meta
      property="og:description"
      content="A minimal Geist Mono Reddit reader for browsing top, new, best, hot, and rising posts across your custom list of subreddits."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var validThemes = ['dark', 'light', 'mocha', 'glass'];
        var storedTheme = localStorage.getItem('subfeed:theme');
        var theme = validThemes.indexOf(storedTheme) !== -1 ? storedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }

        var validFonts = ['geist-mono', 'geist', 'inter', 'jakarta', 'space-grotesk', 'jetbrains-mono'];
        var storedFont = localStorage.getItem('subfeed:font');
        var font = validFonts.indexOf(storedFont) !== -1 ? storedFont : 'geist-mono';
        document.documentElement.setAttribute('data-font', font);
      } catch (_) {}
    </script>
  </head>
  <body class="bg-[var(--sf-bg)] text-[var(--sf-text)] antialiased selection:bg-[var(--sf-accent-soft)] selection:text-[var(--sf-accent)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
